version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: "issue_wakeup.condition"
            go_type: "encoding/json.RawMessage"
            nullable: true
  - engine: "sqlite"
    queries: "internal/localconversation/store/queries/"
    schema: "internal/localconversation/store/schema/"
    gen:
      go:
        package: "sqlitedb"
        out: "internal/localconversation/store/sqlitedb"
        emit_empty_slices: true
