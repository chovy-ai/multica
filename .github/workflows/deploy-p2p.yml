name: Deploy p2p-server

# Builds the p2p-server image, pushes it to Tencent Container Registry and
# rolls it out on the relay host through Tencent Cloud Automation Tools
# (TAT); the workflow never logs in to the host. Setup and credentials are
# described in deploy/p2p-server/README.md.
on:
  push:
    branches: [main]
    paths:
      - "server/cmd/p2p-server/**"
      - "server/internal/p2pserver/**"
      - "server/internal/daemon/p2p/identity.go"
      - "server/go.mod"
      - "server/go.sum"
      - "deploy/p2p-server/**"
      - ".github/workflows/deploy-p2p.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: the selected branch)"
        required: false

permissions:
  contents: read

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: deploy-p2p
  cancel-in-progress: false

env:
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Test
        working-directory: server
        run: go test -race -count=1 ./internal/p2pserver/... ./cmd/p2p-server/...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
      INSTANCE_ID: ${{ vars.P2P_INSTANCE_ID }}
      PUBLIC_IP: ${{ vars.P2P_PUBLIC_IP }}
      REGION: ${{ vars.TENCENTCLOUD_REGION || 'ap-guangzhou' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check configuration
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          missing=()
          for v in TCR_NAMESPACE INSTANCE_ID PUBLIC_IP TCR_USERNAME TCR_PASSWORD SECRET_ID SECRET_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing configuration: ${missing[*]}. See deploy/p2p-server/README.md."
            exit 1
          fi

      - name: Resolve image
        id: meta
        run: |
          tag=$(git rev-parse --short=12 HEAD)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$TCR_NAMESPACE/p2p-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/p2p-server/Dockerfile
          platforms: ${{ vars.P2P_PLATFORM || 'linux/amd64' }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          push: true
          cache-from: type=gha,scope=p2p-server
          cache-to: type=gha,mode=max,scope=p2p-server

      - name: Install tccli
        run: pipx install tccli

      - name: Roll out through TAT
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          content=$({
            echo '#!/bin/bash'
            echo "export P2P_IMAGE='$IMAGE' P2P_TAG='$TAG' P2P_PUBLIC_IP='$PUBLIC_IP'"
            tail -n +2 deploy/p2p-server/deploy.sh
          } | base64 -w0)
          # The first run installs Docker, so allow it time.
          invocation=$(tccli tat RunCommand --region "$REGION" \
            --InstanceIds "[\"$INSTANCE_ID\"]" \
            --CommandName multica-p2p-deploy \
            --CommandType SHELL --Username root --Timeout 900 \
            --Content "$content" | jq -r .InvocationId)
          echo "TAT invocation $invocation"

          filters="[{\"Name\":\"invocation-id\",\"Values\":[\"$invocation\"]}]"
          deadline=$((SECONDS + 960))
          while :; do
            task=$(tccli tat DescribeInvocationTasks --region "$REGION" --Filters "$filters" --HideOutput False | jq '.InvocationTaskSet[0]')
            status=$(jq -r '.TaskStatus // "PENDING"' <<<"$task")
            case "$status" in
              PENDING|DELIVERING|DELIVER_DELAYED|RUNNING|CANCELLING) ;;
              *) break ;;
            esac
            if [ $SECONDS -gt $deadline ]; then
              echo "::error::TAT task still $status after the timeout"
              exit 1
            fi
            sleep 5
          done
          echo "TAT task $status (exit code $(jq -r '.TaskResult.ExitCode' <<<"$task"))"
          jq -r '.TaskResult.Output // ""' <<<"$task" | base64 -d || true
          if [ "$status" != SUCCESS ]; then
            echo "::error::Deploy failed on the host ($status); the previous release is kept running when it was healthy."
            exit 1
          fi

      - name: Check from outside
        # Proves the firewall rules; not fatal because GitHub runners reach
        # mainland China hosts unreliably.
        run: |
          if curl -fsS -o /dev/null -w 'healthz %{http_code} in %{time_total}s\n' --max-time 15 "http://$PUBLIC_IP:8090/healthz"; then
            exit 0
          fi
          echo "::warning::http://$PUBLIC_IP:8090/healthz is not reachable from GitHub; check that the firewall allows TCP 8090."
